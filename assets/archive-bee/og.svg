    <radialGradient id="og-glow" cx="0.26" cy="0.3" r="0.72">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#E8890C" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0E1116" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-word" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#FFF8E7"/>
      <stop offset="1" stop-color="#FFE9A8"/>
    </linearGradient>
    <pattern id="og-comb" width="45.0333" height="78" patternUnits="userSpaceOnUse">
      <g transform="scale(1.3)" fill="none" stroke="#F5A623" stroke-width="0.85" stroke-linejoin="round">
        <path d="M0 -20 L17.3205 -10 L17.3205 10 L0 20 L-17.3205 10 L-17.3205 -10 Z"/>
        <path d="M34.641 -20 L51.9615 -10 L51.9615 10 L34.641 20 L17.3205 10 L17.3205 -10 Z"/>
        <path d="M0 40 L17.3205 50 L17.3205 70 L0 80 L-17.3205 70 L-17.3205 50 Z"/>
        <path d="M34.641 40 L51.9615 50 L51.9615 70 L34.641 80 L17.3205 70 L17.3205 50 Z"/>
        <path d="M17.3205 10 L34.641 20 L34.641 40 L17.3205 50 L0 40 L0 20 Z"/>
        <path d="M-17.3205 10 L0 20 L0 40 L-17.3205 50 L-34.641 40 L-34.641 20 Z"/>
        <path d="M51.9615 10 L69.282 20 L69.282 40 L51.9615 50 L34.641 40 L34.641 20 Z"/>
