  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- quiet hexagon motif, right side -->
  <g fill="none" stroke="#F5A623" stroke-linejoin="round">
    <path d="M950 118 L1108 209 L1108 391 L950 482 L792 391 L792 209 Z" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M950 190 L1046 245.4 L1046 356.1 L950 411.5 L854 356.1 L854 245.4 Z" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M950 253 L1000 282 L1000 340 L950 369 L900 340 L900 282 Z" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- hex-bee mark -->
  <g transform="translate(57.96 52.15) scale(4.3636)">
    <path d="M28.8 44 L35.2 44 L32 51.3 Z" fill="#E8890C"/>
    <g fill="#FFC94D" opacity="0.92">
      <path d="M16.6 12.8 L24.221 17.2 L24.221 26 L16.6 30.4 L8.979 26 L8.979 17.2 Z" transform="rotate(-20 16.6 21.6)"/>
      <path d="M47.4 12.8 L55.021 17.2 L55.021 26 L47.4 30.4 L39.779 26 L39.779 17.2 Z" transform="rotate(20 47.4 21.6)"/>
