      <rect x="16" y="21.5" width="32" height="4.4"/>
      <rect x="16" y="34.1" width="32" height="4.4"/>
    </g>
  </g>

  <text x="92" y="404" textLength="536" lengthAdjust="spacing" fill="url(#og-word)"
        font-family="Sora, 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="126" font-weight="800">SWARM</text>

  <text x="94" y="482" fill="#FFC94D"
        font-family="Inter, 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="46" font-weight="500">Together we are strong.</text>

  <g>
    <rect x="92" y="524" width="212" height="56" rx="28" fill="#F5A623" fill-opacity="0.12" stroke="#F5A623" stroke-opacity="0.42" stroke-width="1.6"/>
    <path d="M124 543.2 L131.5 547.5 L131.5 556.1 L124 560.4 L116.5 556.1 L116.5 547.5 Z" fill="#3FB950"/>
    <text x="146" y="561" textLength="134" lengthAdjust="spacing" fill="#FFE9A8"
          font-family="Inter, 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
          font-size="27" font-weight="600">TESTNET</text>
    <text x="330" y="561" fill="#9AA4B2"
          font-family="Inter, 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
