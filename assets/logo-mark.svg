<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="swarm-mark-title">
  <title id="swarm-mark-title">SWARM hive-bee mark</title>
  <!-- Wings: two honey ellipses, symmetric, behind the body. -->
  <ellipse cx="21" cy="17" rx="12" ry="6.5" transform="rotate(-28 21 17)" fill="#FFB020"/>
  <ellipse cx="43" cy="17" rx="12" ry="6.5" transform="rotate(28 43 17)" fill="#FFB020"/>
  <!-- Body: one hexagon — a single cell of the hive — with the two stripes cut
       out with the even-odd rule, so they always take the background colour. -->
  <path fill-rule="evenodd" fill="#FF8A1F" d="M32 22 L46 30 L46 48 L32 56 L18 48 L18 30 Z M18 35 H46 V39 H18 Z M18 44 H46 V48 H18 Z"/>
</svg>
