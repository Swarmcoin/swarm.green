<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="og-title">
  <title id="og-title">SWARM — Together we are strong. Testnet.</title>
  <defs>
    <pattern id="og-comb" width="56" height="64" patternUnits="userSpaceOnUse">
      <path d="M28 2 L54 17 L54 47 L28 62 L2 47 L2 17 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="og-mask-grad" cx="0.62" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="og-mask"><rect width="1200" height="630" fill="url(#og-mask-grad)"/></mask>
    <radialGradient id="og-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A1F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF8A1F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0908"/>
  <rect width="1200" height="630" fill="url(#og-comb)" mask="url(#og-mask)"/>
  <circle cx="930" cy="150" r="440" fill="url(#og-glow)"/>

  <!-- state pill -->
  <rect x="80" y="92" width="402" height="44" rx="22" fill="#FF8A1F" fill-opacity="0.07" stroke="#FF8A1F" stroke-opacity="0.35"/>
  <circle cx="106" cy="114" r="5" fill="#FF8A1F"/>
  <text x="124" y="120" fill="#FFB020" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="16" letter-spacing="3.5">TESTNET · SWM · NO VALUE</text>

  <text x="80" y="268" fill="#F5EFE4" font-family="Sora, 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif" font-size="92" font-weight="700" letter-spacing="-3">Together we are</text>
  <text x="80" y="368" fill="#FF8A1F" font-family="Sora, 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif" font-size="92" font-weight="700" letter-spacing="-3">strong.</text>

  <text x="80" y="446" fill="#A89F92" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="27">Private, proof-of-work money run by its community.</text>
  <text x="80" y="486" fill="#7D746A" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="27">Testnet only — test coins have no value.</text>

  <!-- hive bee -->
  <g transform="translate(852 240) scale(4.4)">
    <ellipse cx="21" cy="17" rx="12" ry="6.5" transform="rotate(-28 21 17)" fill="#FFB020"/>
    <ellipse cx="43" cy="17" rx="12" ry="6.5" transform="rotate(28 43 17)" fill="#FFB020"/>
    <path fill-rule="evenodd" fill="#FF8A1F" d="M32 22 L46 30 L46 48 L32 56 L18 48 L18 30 Z M18 35 H46 V39 H18 Z M18 44 H46 V48 H18 Z"/>
  </g>

  <line x1="80" y1="546" x2="1120" y2="546" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="80" y="586" fill="#F5EFE4" font-family="Sora, 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="2.2">SWARM</text>
  <text x="1120" y="586" text-anchor="end" fill="#6B645A" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="20" letter-spacing="2">swarm.green</text>
</svg>
